# Serves the Angular app and forwards /api and /uploads to the API container.
# Browser and API share one origin, so no CORS is needed in this setup.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m; # recipe photos

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api:8080;
    }

    # Angular routes (/recipes/5, /admin...) are handled in the browser: always return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
